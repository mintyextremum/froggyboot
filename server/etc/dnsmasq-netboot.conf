# /etc/dnsmasq.d/netboot.conf - proxy-DHCP + TFTP.
# The router keeps handing out IPs; dnsmasq only adds the boot file name.
# dnsmasq does not allow comments after a value, so they go on their own lines.
# port=0: DNS off. bind-interfaces + interface: never answer on other networks.
port=0
interface=@IFACE@
bind-interfaces
dhcp-range=@NET_ADDR@,proxy
log-dhcp
enable-tftp
tftp-root=/srv/netboot/tftp
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
pxe-service=tag:!efi64,x86PC,"Netboot",undionly.kpxe
pxe-service=tag:efi64,X86-64_EFI,"Netboot",ipxe.efi
