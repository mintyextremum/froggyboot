# /etc/samba/netboot.conf - included from the end of /etc/samba/smb.conf.
# SMBv1 is already off in Debian 13 Samba (server min protocol = SMB2_02).

# Windows images, drivers, unattend.xml: WinPE can only read.
[images]
   path = /srv/images/windows
   read only = yes
   browseable = no
   valid users = @SMB_USER@
   hosts allow = @NET_CIDR@ 127.0.0.1
   hosts deny = ALL

# Install reports (reports/) and Users backups (backups/) from WinPE.
[incoming]
   path = /srv/froggyboot/incoming
   read only = no
   browseable = no
   valid users = @SMB_USER@
   hosts allow = @NET_CIDR@ 127.0.0.1
   hosts deny = ALL
   force group = froggyboot
   create mask = 0640
   directory mask = 2750
