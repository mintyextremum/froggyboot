# /etc/nginx/sites-available/netboot - files, passwords, MAC whitelist, log.
log_format netboot '$time_iso8601 $remote_addr mac=$arg_mac user=$remote_user "$request" $status';

# Danger-zone whitelist, generated by install.sh from DANGER_MACS.
# MAC format as iPXE sends it: lowercase, hyphens (00-1a-2b-3c-4d-5e).
map $arg_mac $danger_mac_ok {
    default 0;
    include /etc/nginx/netboot-danger-macs.conf;
}

server {
    listen 80 default_server;
    root /srv/netboot/http;
    access_log /var/log/nginx/netboot.log netboot;
    autoindex off;
    default_type text/plain;

    allow @NET_CIDR@;
    allow 127.0.0.1;
    deny all;

    location = /SHA256SUMS { deny all; }

    # Windows: technician password.
    location ^~ /secure/ {
        auth_basic "netboot-windows";
        auth_basic_user_file /etc/nginx/netboot-windows.htpasswd;
    }

    # Danger zone: whitelist on the WHOLE folder (checked before the password),
    # then the admin password. MAC is client-supplied: this stops mistakes,
    # not attackers.
    location ^~ /danger/ {
        if ($danger_mac_ok = 0) { return 403; }
        auth_basic "netboot-danger";
        auth_basic_user_file /etc/nginx/netboot-danger.htpasswd;
    }
}
