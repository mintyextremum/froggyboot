# /etc/nginx/sites-available/netboot - generated by install.sh from server/etc/nginx-netboot.conf.
log_format netboot '$time_iso8601 $remote_addr mac=$arg_mac user=$remote_user "$request" $status';

upstream froggyboot_app {
    server 127.0.0.1:@APP_PORT@;
    keepalive 8;
}

server {
    listen 80 default_server;
@HTTPS_LISTEN@
    root /srv/netboot/http;
    access_log /var/log/nginx/netboot.log netboot;
    autoindex off;
    default_type text/plain;

    allow @NET_CIDR@;
    allow 127.0.0.1;
    deny all;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /SHA256SUMS { deny all; }

    # Per-PC main menu (host name, exam mode, assignments) from the app.
    # If the app is down, the static copy written by `froggyboot render` is served.
    location = /menu.ipxe {
        proxy_pass http://froggyboot_app;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        error_page 502 503 504 = @static;
    }
    location @static { try_files $uri =404; }

    # Public app endpoints: menu choices and hardware reports.
    location ^~ /api/event/ {
        proxy_pass http://froggyboot_app;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }
    location = /api/inventory {
        client_max_body_size 512k;
        proxy_pass http://froggyboot_app;
    }
    location ^~ /api/ { return 404; }

    # Zone checks: passwords, one-time codes, approvals, assignments, MAC whitelist.
    # If the app is down, the subrequest fails and the zones stay closed.
    location = /_auth/windows {
        internal;
        proxy_pass http://froggyboot_app/api/auth/windows;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
    location = /_auth/danger {
        internal;
        proxy_pass http://froggyboot_app/api/auth/danger;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /secure/froggy.txt {
@HTTPS_ONLY@
        auth_request /_auth/windows;
        proxy_pass http://froggyboot_app/api/froggy.txt;
        proxy_set_header X-Original-URI $request_uri;
    }
    location ^~ /secure/ {
@HTTPS_ONLY@
        auth_request /_auth/windows;
    }
    location ^~ /danger/ {
@HTTPS_ONLY@
        auth_request /_auth/danger;
    }

    # Admin panel: the danger-zone (admin) password.
    location /panel/ {
@HTTPS_ONLY@
        auth_basic "froggyboot-panel";
        auth_basic_user_file /etc/nginx/netboot-danger.htpasswd;
        proxy_pass http://froggyboot_app;
        proxy_set_header X-Remote-User $remote_user;
    }
    location = /panel { return 301 /panel/; }
}
